      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#fondo)"/>
  <!-- antena con destello -->
  <line x1="64" y1="30" x2="64" y2="40" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="26" r="6" fill="#fde68a"/>
